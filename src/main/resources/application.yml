server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /

spring:
  application:
    name: openmrs-cce-emitter-adaptor
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

emitter:
  target: ${OPENMRS_EMITTER_TARGET:beckn}           # beckn (default on this branch) | openhim (read once at start)

  # Read only when target=beckn. See docs/beckn-integration.md § 11.
  # Two protocols:
  #   - the CCE events leg (every resource to the HIE, which passes it on to CCE) uses the Sygnal action
  #     sygnal/event/report, through OpenMRS's Sygnal onix (onix-openmrs): settings under beckn.sygnal.*;
  #   - the Spice referral legs (referrals in: on_status, referrals out: update) use standard Beckn,
  #     through onix-bpp / onix-bap: settings under beckn.onix.bap/bpp-caller-url, beckn.self.*, beckn.spice.*.
  # Every value can be set from the environment. The variables carry the OPENMRS_EMITTER_ prefix so
  # that this adaptor, the receiver and the OpenHIM emitter can share one env file.
  # Values without a default must be set before the emitter starts in Beckn mode (only those of the legs
  # that are on), or use the beckn-demo profile, application-beckn-demo.yml, for made-up example values.
  beckn:
    onix:
      bap-caller-url: ${OPENMRS_EMITTER_BECKN_ONIX_BAP_CALLER_URL:http://onix-bap:8081/bap/caller}   # referrals out: + /update
      bpp-caller-url: ${OPENMRS_EMITTER_BECKN_ONIX_BPP_CALLER_URL:http://onix-bpp:8082/bpp/caller}   # referrals in: + /on_status
      timeout: ${OPENMRS_EMITTER_BECKN_ONIX_TIMEOUT:50s}                     # every leg; outermost hop of the timeout budget
    schema-base-url: ${OPENMRS_EMITTER_BECKN_SCHEMA_BASE_URL:https://raw.githubusercontent.com/openphc/cce-beckn-service/main/schema}
    sygnal:                                                  # CCE events leg (Sygnal)
      caller-url: ${OPENMRS_EMITTER_BECKN_SYGNAL_CALLER_URL:http://onix-openmrs:8082/sygnal/caller}   # + /sygnal/event/report
      id: ${OPENMRS_EMITTER_BECKN_SYGNAL_ID:bap.openmrs.nextsteps.mdtlabs.org}  # context.senderId and from.id; the subscriber id of onix-openmrs's keys
      network-id: ${OPENMRS_EMITTER_BECKN_SYGNAL_NETWORK_ID:sygnal.nextsteps.mdtlabs.org/sygnal_demo_network_registry}  # required; context.networkId
      hie:
        id: ${OPENMRS_EMITTER_BECKN_SYGNAL_HIE_ID:bap.openhim.nextsteps.mdtlabs.org}  # context.receiverId
        uri: ${OPENMRS_EMITTER_BECKN_SYGNAL_HIE_URI:}                          # required; the HIE's public onix receiver base, e.g. https://hie.example.org/sygnal/receiver
        transaction-id: ${OPENMRS_EMITTER_BECKN_SYGNAL_HIE_TRANSACTION_ID:}    # optional fixed UUID; empty = a new UUID per event
    self:                                                    # Spice referral legs (Beckn)
      network-id: ${OPENMRS_EMITTER_BECKN_SELF_NETWORK_ID:}                  # optional; sent as context.networkId when set
      bap-id: ${OPENMRS_EMITTER_BECKN_SELF_BAP_ID:}
      bap-uri: ${OPENMRS_EMITTER_BECKN_SELF_BAP_URI:}
      bpp-id: ${OPENMRS_EMITTER_BECKN_SELF_BPP_ID:}
      bpp-uri: ${OPENMRS_EMITTER_BECKN_SELF_BPP_URI:}
    spice:
      name: ${OPENMRS_EMITTER_BECKN_SPICE_NAME:Spice}
      bap-id: ${OPENMRS_EMITTER_BECKN_SPICE_BAP_ID:}
      bap-uri: ${OPENMRS_EMITTER_BECKN_SPICE_BAP_URI:}
      bpp-id: ${OPENMRS_EMITTER_BECKN_SPICE_BPP_ID:}
      bpp-uri: ${OPENMRS_EMITTER_BECKN_SPICE_BPP_URI:}
      facility-codes: ${OPENMRS_EMITTER_BECKN_SPICE_FACILITY_CODES:}     # comma-separated, e.g. 0417,0418
      referrals-in:                                          # OpenMRS sends on_status here
        contract-id: ${OPENMRS_EMITTER_BECKN_REFERRALS_IN_CONTRACT_ID:}
        transaction-id: ${OPENMRS_EMITTER_BECKN_REFERRALS_IN_TRANSACTION_ID:}
        commitment-file: ${OPENMRS_EMITTER_BECKN_REFERRALS_IN_COMMITMENT_FILE:classpath:beckn/commitment-referral.json}
      referrals-out:                                         # OpenMRS sends update here
        contract-id: ${OPENMRS_EMITTER_BECKN_REFERRALS_OUT_CONTRACT_ID:}
        transaction-id: ${OPENMRS_EMITTER_BECKN_REFERRALS_OUT_TRANSACTION_ID:}
        commitment-file: ${OPENMRS_EMITTER_BECKN_REFERRALS_OUT_COMMITMENT_FILE:classpath:beckn/commitment-referral.json}
    legs:
      cce-events: ${OPENMRS_EMITTER_BECKN_LEG_CCE_EVENTS:true}               # Sygnal, to the HIE
      referrals-in: ${OPENMRS_EMITTER_BECKN_LEG_REFERRALS_IN:true}           # Beckn on_status, to Spice
      referrals-out: ${OPENMRS_EMITTER_BECKN_LEG_REFERRALS_OUT:true}         # Beckn update, to Spice
  openmrs:
    name: "${OPENMRS_NAME:openmrs}"
    base-url: "${OPENMRS_BASE_URL:http://localhost:8080/openmrs}"
    fhir-path: "${OPENMRS_FHIR_PATH:/ws/fhir2/R4}"
    auth:
      type: "${OPENMRS_AUTH_TYPE:basic}"
      username: "${OPENMRS_AUTH_USERNAME:admin}"
      password: "${OPENMRS_AUTH_PASSWORD:Admin123}"
      token: "${OPENMRS_AUTH_TOKEN:}"
      oauth2:
        token-url: "${OPENMRS_AUTH_OAUTH2_TOKEN_URL:}"
        client-id: "${OPENMRS_AUTH_OAUTH2_CLIENT_ID:}"
        client-secret: "${OPENMRS_AUTH_OAUTH2_CLIENT_SECRET:}"
        scope: "${OPENMRS_AUTH_OAUTH2_SCOPE:}"

  openhim:
    name: "${OPENHIM_NAME:openhim}"
    base-url: "${OPENHIM_BASE_URL:http://localhost:5001/fhir}"
    auth:
      type: "${OPENHIM_AUTH_TYPE:basic}"
      username: "${OPENHIM_AUTH_USERNAME:}"
      password: "${OPENHIM_AUTH_PASSWORD:}"
      token: "${OPENHIM_AUTH_TOKEN:}"
    ssl-trust-all: ${OPENHIM_SSL_TRUST_ALL:false}
    append-resource-type: ${OPENHIM_APPEND_RESOURCE_TYPE:true}
    retry:
      max-attempts: ${OPENHIM_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${OPENHIM_RETRY_BACKOFF_MS:2000}

  polling:
    fhir:
      enabled: ${POLLING_FHIR_ENABLED:true}
      interval-seconds: ${POLLING_FHIR_INTERVAL_SECONDS:30}
      page-size: ${POLLING_FHIR_PAGE_SIZE:50}
      overlap-seconds: ${POLLING_FHIR_OVERLAP_SECONDS:5}
      follow-prior-order: ${POLLING_FHIR_FOLLOW_PRIOR_ORDER:true}
      resource-types: ${POLLING_FHIR_RESOURCE_TYPES:Patient,RelatedPerson,Encounter,Observation,Condition,ServiceRequest,MedicationRequest,MedicationDispense}

  checkpoint:
    store-type: "${CHECKPOINT_STORE_TYPE:file}"
    file-path: "${CHECKPOINT_FILE_PATH:./data/checkpoints.json}"

  patient:
    national-id:
      enabled: ${PATIENT_NATIONAL_ID_ENABLED:true}
      system: "${PATIENT_NATIONAL_ID_SYSTEM:http://moh.gov.rw/fhir/identifier/national-id}"
      code: "${PATIENT_NATIONAL_ID_CODE:national-id}"
      cache-ttl-seconds: ${PATIENT_NATIONAL_ID_CACHE_TTL_SECONDS:3600}
      cache-max-size: ${PATIENT_NATIONAL_ID_CACHE_MAX_SIZE:10000}
      on-missing: "${PATIENT_NATIONAL_ID_ON_MISSING:skip}"

  referral:
    response:
      enabled: ${REFERRAL_RESPONSE_ENABLED:true}
      order-type-name: "${REFERRAL_RESPONSE_ORDER_TYPE_NAME:Referral}"
      category-system: "${REFERRAL_RESPONSE_CATEGORY_SYSTEM:http://cce.openphc.org/CodeSystem/event-type}"
      category-code: "${REFERRAL_RESPONSE_CATEGORY_CODE:referral-response}"
      category-display: "${REFERRAL_RESPONSE_CATEGORY_DISPLAY:Referral Response}"
      based-on-identifier-system: "${REFERRAL_RESPONSE_BASED_ON_SYSTEM:http://mdtlabs.com/service-request-id}"
      flip-intent: ${REFERRAL_RESPONSE_FLIP_INTENT:false}
      include-instructions: ${REFERRAL_RESPONSE_INCLUDE_INSTRUCTIONS:true}
      instructions-system: "${REFERRAL_RESPONSE_INSTRUCTIONS_SYSTEM:http://cce.openphc.org/CodeSystem/referral-instructions}"
      instructions-code: "${REFERRAL_RESPONSE_INSTRUCTIONS_CODE:referral-instructions}"
      instructions-display: "${REFERRAL_RESPONSE_INSTRUCTIONS_DISPLAY:Referral Instructions}"
      response-encounter-type-uuid: "${REFERRAL_RESPONSE_ENCOUNTER_TYPE_UUID:479e4805-90d9-44f5-b252-333d8a687e52}"
    direction:
      enabled: ${REFERRAL_DIRECTION_ENABLED:true}
      category-system: "${REFERRAL_DIRECTION_CATEGORY_SYSTEM:http://cce.openphc.org/CodeSystem/referral-direction}"
      inbound-code: "${REFERRAL_DIRECTION_INBOUND_CODE:inbound}"
      outbound-code: "${REFERRAL_DIRECTION_OUTBOUND_CODE:outbound}"
      inbound-encounter-type-uuid: "${REFERRAL_DIRECTION_INBOUND_ENCOUNTER_TYPE_UUID:de0f5558-9813-4fa3-8613-467015f9fabd}"
      destination-concept-uuid: "${REFERRAL_DIRECTION_DESTINATION_CONCEPT_UUID:5f8a2c6e-3b9d-4e1f-a7c4-0d6e9b2a8f15}"
      facility-code-attribute-type-uuid: "${REFERRAL_DIRECTION_FACILITY_CODE_ATTRIBUTE_TYPE_UUID:9e2b7c40-5d1a-4f8e-b3c6-1a7d0e4f9c52}"
      destination-identifier-system: "${REFERRAL_DIRECTION_DESTINATION_IDENTIFIER_SYSTEM:http://cce.openphc.org/fhir/NamingSystem/facility-code}"

  test-order-category:
    enabled: ${TEST_ORDER_CATEGORY_ENABLED:true}
    order-type-uuid: "${TEST_ORDER_CATEGORY_ORDER_TYPE_UUID:52a447d3-a64a-11e3-9aeb-50e549534c5e}"
    system: "${TEST_ORDER_CATEGORY_SYSTEM:http://snomed.info/sct}"
    code: "${TEST_ORDER_CATEGORY_CODE:108252007}"
    display: "${TEST_ORDER_CATEGORY_DISPLAY:Laboratory procedure}"

  care-setting:
    enabled: ${CARE_SETTING_TAG_ENABLED:true}
    system: "${CARE_SETTING_TAG_SYSTEM:http://cce.openphc.org/CodeSystem/care-setting}"
    code: "${CARE_SETTING_TAG_CODE:}"
    display: "${CARE_SETTING_TAG_DISPLAY:}"

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.openphc.cce: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:INFO}
    ca.uhn.fhir: ${LOG_LEVEL_FHIR:INFO}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_INCLUDE:health,info,prometheus,metrics}
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: ${HEALTH_PROBES_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}
